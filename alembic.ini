[alembic]
script_location = alembic
# The repository root on sys.path, so a bare `alembic upgrade head` finds the `src` package that
# env.py imports (Issue 3). Without it only scripts/db/*.sh worked, because they set PYTHONPATH.
prepend_sys_path = .
path_separator = os
# Placeholder only: env.py overwrites this with DATABASE_URL from src.core.config
# (.env) before every run, in both online and offline mode.
sqlalchemy.url = postgresql://localhost/postgres

file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

# No handler of their own: they propagate to root's. With one here as well, every line printed
# twice (Issue 3).
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
