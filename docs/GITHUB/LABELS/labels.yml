# ClinicQ issue & PR labels: single source of truth.
#
# Sync with `scripts/gh_sync_labels.py` (or `gh label create`). Edit here, never on GitHub directly.
# Each entry: name (required), color (6-char hex, no '#'), description.
#
# Groups: AREA (where the work lives) · TYPE (what kind of work) · MILESTONE PHASE ·
#         STATUS (workflow state) · PRIORITY · TEAM (who owns it) · RISK

# ---------------------------------------------------------------- area
- name: "AREA: Auth"
  color: "a58f2e"
  description: "Identity, sessions, RBAC, consent"
- name: "AREA: Clinics"
  color: "0e8a16"
  description: "Sites, queues, services, clinic configuration"
- name: "AREA: Discovery"
  color: "1d76db"
  description: "Geolocation search, map, clinic directory"
- name: "AREA: Queue"
  color: "b60205"
  description: "Ticket engine, lifecycle, wait estimates; the critical path"
- name: "AREA: Dashboard"
  color: "263373"
  description: "Clinic staff dashboard"
- name: "AREA: Display"
  color: "5319e7"
  description: "Waiting-room board and kiosk devices"
- name: "AREA: Notifications"
  color: "fbca04"
  description: "Push, SMS, WhatsApp delivery"
- name: "AREA: Channels"
  color: "d93f0b"
  description: "USSD and WhatsApp adapters, i18n"
- name: "AREA: Appointments"
  color: "006b75"
  description: "Slots, bookings, check-in, reminders"
- name: "AREA: Reporting"
  color: "6882f1"
  description: "Analytics, dashboards, exports"
- name: "AREA: Infra"
  color: "c5def5"
  description: "CI/CD, environments, deployment, monitoring"
- name: "AREA: Frontend"
  color: "bfd4f2"
  description: "Templates, htmx, Tailwind, PWA"
- name: "AREA: Database"
  color: "7057ff"
  description: "Models, migrations, PostGIS"

# ---------------------------------------------------------------- type
- name: "TYPE: Feature"
  color: "0e8a16"
  description: "New capability"
- name: "TYPE: Bug"
  color: "e99695"
  description: "Something isn't working"
- name: "TYPE: Chore"
  color: "cfd3d7"
  description: "Maintenance, dependencies, cleanup"
- name: "TYPE: Docs"
  color: "0075ca"
  description: "Documentation only"
- name: "TYPE: Test"
  color: "c2e0c6"
  description: "Test coverage or test tooling"
- name: "TYPE: Spike"
  color: "d4c5f9"
  description: "Time-boxed investigation, output is a decision"
- name: "TYPE: Contract"
  color: "f9d0c4"
  description: "OpenAPI contract or interface definition; unblocks other people"

# ---------------------------------------------------------------- status
- name: "STATUS: Ready"
  color: "0e8a16"
  description: "Dependencies met, acceptance criteria agreed, can be started"
- name: "STATUS: In Progress"
  color: "fbca04"
  description: "Someone is actively working on this"
- name: "STATUS: Blocked"
  color: "b60205"
  description: "Waiting on another issue or an external dependency; say which in a comment"
- name: "STATUS: Needs Review"
  color: "1d76db"
  description: "PR open, waiting on a code owner"
- name: "STATUS: Needs Decision"
  color: "d876e3"
  description: "Waiting on a team decision, not on code"

# ---------------------------------------------------------------- priority & risk
- name: "PRIORITY: Critical Path"
  color: "b60205"
  description: "On the critical path: a day late here is a day late for the project"
- name: "PRIORITY: High"
  color: "d93f0b"
  description: "Needed for the current sprint goal"
- name: "PRIORITY: Normal"
  color: "fef2c0"
  description: "Scheduled, not urgent"
- name: "PRIORITY: Nice To Have"
  color: "ededed"
  description: "Cut first if the sprint is over-committed"
- name: "RISK: Privacy"
  color: "5319e7"
  description: "Touches patient personal or health-adjacent data; needs a privacy review"
- name: "RISK: Security"
  color: "b60205"
  description: "Auth, tenancy, encryption or exposure surface"
- name: "RISK: External dependency"
  color: "e4e669"
  description: "Depends on a gateway, provider or third party outside the team's control"

# ---------------------------------------------------------------- team
- name: "TEAM: Backend-lead"
  color: "006b75"
  description: "Owned by the Backend Lead"
- name: "TEAM: Backend-integrations"
  color: "0052cc"
  description: "Owned by the Backend (Integrations) Dev"
- name: "TEAM: Frontend-patient"
  color: "bfdadc"
  description: "Owned by the Frontend (Patient) Dev"
- name: "TEAM: Frontend-clinic"
  color: "c5def5"
  description: "Owned by the Frontend (Clinic) Dev"
- name: "TEAM: Devops-qa"
  color: "f9d0c4"
  description: "Owned by the DevOps/QA Lead"
- name: "TEAM: Data-research"
  color: "d4c5f9"
  description: "Owned by the Data & Research Lead"
- name: "TEAM: Pair"
  color: "fbca04"
  description: "Deliberately paired: two people, one issue"

# ---------------------------------------------------------------- misc
- name: "Good First Issue"
  color: "7057ff"
  description: "Small, self-contained, safe for a first contribution"
- name: "Help Wanted"
  color: "008672"
  description: "Owner is stuck or over capacity; pick this up"
- name: "Capstone Deliverable"
  color: "0075ca"
  description: "Feeds the report, demo or presentation"
