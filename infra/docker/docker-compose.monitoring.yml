# Monitoring for ClinicQ (Issue 14): uptime checks with Gatus, and, behind the `errors` profile, a
# self-hosted error tracker (GlitchTip, which speaks Sentry's protocol) for a team that does not
# use Sentry's hosted free tier. Run it on a machine other than the ones it watches.
#
#   STAGING_URL=https://staging.… PRODUCTION_URL=https://… TEAM_WEBHOOK_URL=https://hooks.slack.com/… \
#     docker compose -f infra/docker/docker-compose.monitoring.yml --project-directory infra/docker up -d
#
#   # error tracking too; then create a project and put its DSN in the app's SENTRY_DSN:
#   GLITCHTIP_SECRET_KEY=$(openssl rand -hex 32) docker compose … --profile errors up -d
#
# docs/CICD/RUNBOOK_ALERTS.md is the runbook; infra/monitoring/gatus.yaml the checks.

name: clinicq-monitoring

services:
  gatus:
    image: twinproduction/gatus:v5.36.0
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/gatus.yaml
      STAGING_URL: ${STAGING_URL:?Set STAGING_URL, e.g. https://staging.clinicq.example.org}
      PRODUCTION_URL: ${PRODUCTION_URL:?Set PRODUCTION_URL, e.g. https://clinicq.example.org}
      TEAM_WEBHOOK_URL: ${TEAM_WEBHOOK_URL:?Set TEAM_WEBHOOK_URL to the team channel's webhook}
    volumes:
      - ../monitoring/gatus.yaml:/config/gatus.yaml:ro
      - gatus-data:/data
    ports:
      # The status page, for whoever runs the monitor; it is not published beyond the machine.
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    profiles: ["errors"]
    restart: unless-stopped
    command: ["./bin/run-all-in-one.sh"]
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY (openssl rand -hex 32)}
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-valkey:6379/0
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8800}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "false"
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8800}:8000"

  glitchtip-db:
    # The one PostgreSQL image the repository pins (decision 4; test_dev_stack_compose.py): GlitchTip
    # needs no PostGIS, and a second image would be a second version to keep patched.
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    profiles: ["errors"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 30

  glitchtip-valkey:
    image: redis:8-alpine
    profiles: ["errors"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gatus-data:
  glitchtip-db:
