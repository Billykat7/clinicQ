# Full local stack for BK ClinicQ: PostgreSQL 18 + PostGIS and Redis (from docker-compose.db.yml),
# the API container, and nginx in front of it.
#
# From repo root:
#   make db-up        only db + redis; run the API on the host with `make run` (or `make dev`)
#   make docker-up    everything, API included, built from the working tree
#   make docker-down  stop everything (volumes are kept; `make db-reset` wipes them)
# Or, from infra/docker: `docker compose up -d db redis`.
#
# Then: http://localhost:8000/health (liveness heartbeat; also /health/live),
#       http://localhost:8000/health/ready (readiness + per-dependency status) and
#       http://localhost:8000/docs
# Migrations stay a deliberate step: `make migrate-up` from the host applies them to the same
# database the container uses.
#
# Nginx is the published entrypoint so X-Real-IP / X-Forwarded-For reach the app; without
# this hop, the API often sees only the Docker bridge (e.g. 172.18.0.1) for client IP.
#
# Rate limiting: the app enforces per-route limits on /api/v1/auth/* (SlowAPI; see
# docs/SECURITY/RATE_LIMITING.md). For production behind nginx (or another edge proxy), add edge
# limits and exempt /health — see docs/INFRASTRUCTURE/REVERSE-PROXY-RATE-LIMITS.md.

name: clinicq

include:
  - docker-compose.db.yml

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ../nginx/docker-compose.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: "1"
    expose:
      - "8000"
    # Optional so `docker compose config` and a fresh clone work before .env exists.
    env_file:
      - path: ../../.env
        required: false
    environment:
      # The same URLs as .env.example with the host swapped for the service name: inside this
      # container `localhost` is the container itself. These override whatever .env says, so the
      # container always talks to this stack's db and redis.
      DATABASE_URL: postgresql://${DB_USER:-btk_user}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-btk}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The Dockerfile's liveness probe, polled every second while the app starts so
      # `docker compose up --wait` returns as soon as it answers instead of after the 30s interval.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Resource limits (for docker compose up; deploy.resources used in swarm)
    mem_limit: 1g
    cpus: 2
