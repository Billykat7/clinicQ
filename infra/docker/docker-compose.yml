# Local run: nginx → BK ClinicQ API (PostgreSQL/PostGIS is external — set DATABASE_URL in `.env`).
# Usage: set DATABASE_URL in repo-root `.env`, then from repo root:
#   docker compose -f infra/docker/docker-compose.yml --project-directory infra/docker up --build
# Or: make docker-up
# Then: http://localhost:8000/health (liveness heartbeat; also /health/live),
#       http://localhost:8000/health/ready (readiness + per-dependency status) and
#       http://localhost:8000/docs
#
# Nginx is the published entrypoint so X-Real-IP / X-Forwarded-For reach the app; without
# this hop, the API often sees only the Docker bridge (e.g. 172.18.0.1) for client IP.
#
# Rate limiting: the app enforces per-route limits on /api/v1/auth/* (SlowAPI; see
# docs/SECURITY/RATE_LIMITING.md). For production behind nginx (or another edge proxy), add edge
# limits and exempt /health — see docs/INFRASTRUCTURE/REVERSE-PROXY-RATE-LIMITS.md.
#
# If Postgres runs on your host (not in Docker), use host.docker.internal instead of localhost
# in DATABASE_URL so the app container can reach it (Docker Desktop; on Linux you may need
# extra_hosts: - "host.docker.internal:host-gateway" under `app`).

name: clinicq

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../nginx/docker-compose.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: "1"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env to your PostgreSQL URL (PostGIS required for geo features)}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-min-32-characters-long}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ../../.env
    # Resource limits (for docker compose up; deploy.resources used in swarm)
    mem_limit: 1g
    cpus: 2
    # Optional: mount source for local dev (omit for production-like run)
    # volumes:
    #   - .:/app
