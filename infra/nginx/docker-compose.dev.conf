# HTTP reverse proxy for local `docker compose` (see infra/docker/docker-compose.yml).
# Preserves the client address the edge sees as X-Real-IP / X-Forwarded-For so the
# app does not only see the Docker bridge (e.g. 172.18.0.1).

upstream app_backend {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }
}
