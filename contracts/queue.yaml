# ClinicQ: the queue contract (Issue 40 starts it; Issue 47 completes it).
#
# Hand-written from src/modules/queue/router.py, so the web ticket page (Issue 68), the front-desk
# board and walk-in form (Issues 49, 51) and the USSD and WhatsApp adapters (Issues 73, 75) can be
# built against a stable document. Checked against the running application's /openapi.json in both
# directions by tests/integration/contracts/test_openapi_contracts.py (the Issue 30 harness). This
# contract owns every route whose path contains /tickets, wherever it hangs: under /sites (staff),
# /clinics (a patient joining) or /patients/me (a patient's own).
#
# The rule behind every operation here is non-negotiable 1: one join service for every channel. The
# web join and the walk-in are two routes onto the same function, which the USSD and WhatsApp
# adapters call directly, and every ticket draws its number from one sequence per queue per
# Johannesburg service day. The source is recorded, and never used to order the queue.
#
# Four conventions:
#
#   * a join that finds the patient already in the queue today answers 200 with created: false and
#     the ticket they hold; a new ticket answers 201;
#   * a refusal is 409 with a code queue.join.<reason> and a sentence a patient can be shown as it
#     stands; rate limiting is 429 with Retry-After;
#   * a staff route names a {site_id} and goes through the site guard: another clinic's id is the
#     same 404 as an id that never existed;
#   * every example is validated against the schema it claims to be an example of.

openapi: 3.1.0

info:
  title: ClinicQ queue
  version: "0.6.0"
  description: |
    Joining a queue and reading tickets.

    **One queue, not two.** A remote join and a walk-in take their numbers from the same sequence,
    in arrival order. `source` says which door a ticket came through; nothing orders by it.

    **Numbers.** `number` is the queue's prefix and the day's sequence (`T043`), restarting at
    Johannesburg midnight. `reference_code` is six characters with no `0`/`O` or `1`/`I`/`L`,
    written in two groups (`K7M-4QP`) so it can be read aloud at the desk. It finds a ticket; it is
    not a secret and never signs anybody in.

    **Abuse guards** (remote joins only): per phone number across every channel
    (`QUEUE_JOIN_RATE_LIMIT_PER_PHONE`, 6 an hour by default), per client address on the web
    (`..._PER_IP`, 30 an hour) and per clinic per service day (`QUEUE_JOIN_SITE_DAILY_CAP`, 1500).
    A walk-in issued at the desk is exempt from all three.

    **Time.** Every datetime is ISO 8601 with an offset, in `Africa/Johannesburg` (`+02:00`);
    `service_day` is the Johannesburg calendar date.

servers:
  - url: /api/v1
    description: This deployment.

tags:
  - name: queue
    description: Joining a queue from any channel, and the tickets that result.

paths:
  # ── A patient joins (Issue 40) ──────────────────────────────────────────────────────────
  /clinics/{site_id}/queues/{queue_id}/tickets:
    post:
      tags: [queue]
      operationId: queueJoin
      summary: Join a queue as the signed-in patient
      description: |
        The clinic must be publicly listed; an unlisted clinic's queue is the same `404` as one that
        does not exist. The patient's name is never copied onto the ticket: it stays on their own
        record, which reaches a public screen only with their consent.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/QueueId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinIn" }
            example: { reason_text: "Repeat script", comment_consent: false }
      responses:
        "201":
          description: A new ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinOut" }
              example:
                ticket:
                  id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T005
                  reference_code: K7M-4QP
                  source: web
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                created: true
                waiting_ahead: 4
                wait: { low_minutes: 10, high_minutes: 25, confidence: medium, approximate: false, label: "~10–25 min" }
                message: "You are T005."
        "200":
          description: The patient already held a ticket in this queue today; it is returned, and nothing new is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinOut" }
              example:
                ticket:
                  id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T005
                  reference_code: K7M-4QP
                  source: web
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                created: false
                waiting_ahead: 3
                wait: { low_minutes: 10, high_minutes: 20, confidence: medium, approximate: false, label: "~10–20 min" }
                message: "You already hold T005 in this queue."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such queue at a listed clinic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such queue.", code: "http.not_found" }
        "409": { $ref: "#/components/responses/JoinRefused" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429":
          description: Too many joins from this phone number or this address in the window.
          headers:
            Retry-After:
              description: Seconds until the window has room again.
              schema: { type: integer, minimum: 1 }
              example: 3600
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Too many joins in a short time. Please wait a while and try again.", code: "http.too_many_requests" }

  # ── The front desk issues a walk-in (Issue 40) ──────────────────────────────────────────
  /sites/{site_id}/queues/{queue_id}/tickets:
    post:
      tags: [queue]
      operationId: queueIssueWalkIn
      summary: Issue a walk-in ticket at the front desk
      description: |
        The same service and the same sequence as a remote join. `name` is what the desk calls the
        patient by and is never shown on the public board. With a `phone`, the walk-in is that
        patient's ticket, so a second walk-in for the same number answers `200` with the first, and
        `notifications_consent` records the patient's answer to being messaged about their turn
        (Issue 51). A repeated `Idempotency-Key` (a double-pressed *Issue ticket*) answers `200` with
        the ticket the first request issued and issues nothing. Requires `queues.tickets` `update` at
        this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/QueueId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalkInIn" }
            example: { name: "Gogo M.", reason_text: null, comment_consent: false, phone: null, notifications_consent: false }
      responses:
        "201":
          description: A new walk-in ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinOut" }
              example:
                ticket:
                  id: 01a09cf1-9563-7512-aebc-6e2b4b0beb58
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T006
                  reference_code: 5CU-CHK
                  source: walk_in
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:33:40+02:00"
                  walk_in_name: "Gogo M."
                created: true
                waiting_ahead: 5
                wait: { low_minutes: 30, high_minutes: 60, confidence: low, approximate: true, label: "~30–60 min (approximate)" }
                message: "You are T006."
        "200":
          description: |
            The phone number given already holds a ticket in this queue today, or the request repeats
            an `Idempotency-Key` already used for this walk-in; the existing ticket is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            The walk-in was refused and nothing was issued. `code` is one of the join refusals
            (`queue.join.clinic_closed`, `queue.join.queue_closed`, `queue.join.queue_full`; see
            `JoinRefused`), or `ticket.request.key_reused` when the `Idempotency-Key` was already used
            for another action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Hillbrow Community Health Centre is closed: Water outage", code: "queue.join.clinic_closed" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/tickets/{ticket_id}/undo-walk-in:
    post:
      tags: [queue]
      operationId: queueUndoWalkIn
      summary: Undo the last walk-in issued at the desk, within the undo window
      description: |
        Takes back the most recent walk-in the signed-in person issued today at this clinic, while it
        is still waiting and within `QUEUE_WALK_IN_UNDO_SECONDS` (120 by default) of issuing it: the
        patient is most likely still at the counter. The ticket is cancelled with the reason
        `joined_by_mistake`, and its audit row says `undo walk-in`; the number is never reused. An
        older or someone else's walk-in is cancelled with the cancel route instead. Requires
        `queues.tickets` `update` at this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      responses:
        "200":
          description: The walk-in, cancelled, and how many behind it moved up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Nothing changed. `code` is `ticket.walk_in_undo.not_latest` when the ticket is not the last
            walk-in this person issued today, `ticket.walk_in_undo.window_closed` when it was issued
            longer ago than the window, or `ticket.transition.stale` when it is no longer waiting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                detail: "T012 was issued more than 120 seconds ago, so it can no longer be undone. Cancel the ticket instead."
                code: "ticket.walk_in_undo.window_closed"
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Reading tickets (Issue 40) ──────────────────────────────────────────────────────────
  /sites/{site_id}/tickets:
    get:
      tags: [queue]
      operationId: queueSiteTickets
      summary: The clinic's tickets still in today's queues
      description: |
        Every ticket not yet finished today (`waiting`, `called`, `recalled`, `in_progress`), queue by
        queue in sequence order, or one queue's with `queue_id`. The reason for the visit is never in
        a list. Requires `queues.tickets` `read` at this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - name: queue_id
          in: query
          required: false
          description: Only this queue's tickets.
          schema: { type: [string, "null"] }
          example: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
      responses:
        "200":
          description: The day's open tickets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketListOut" }
              example:
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                service_day: "2026-09-14"
                total: 2
                items:
                  - id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                    site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                    queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                    number: T005
                    reference_code: K7M-4QP
                    source: web
                    status: waiting
                    service_day: "2026-09-14"
                    joined_at: "2026-09-14T07:31:12+02:00"
                    walk_in_name: null
                  - id: 01a09cf1-9563-7512-aebc-6e2b4b0beb58
                    site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                    queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                    number: T006
                    reference_code: 5CU-CHK
                    source: walk_in
                    status: waiting
                    service_day: "2026-09-14"
                    joined_at: "2026-09-14T07:33:40+02:00"
                    walk_in_name: "Gogo M."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Moving a ticket (Issue 41) ──────────────────────────────────────────────────────────
  /sites/{site_id}/tickets/{ticket_id}/transitions:
    post:
      tags: [queue]
      operationId: queueTransitionTicket
      summary: Move a ticket to another status
      description: |
        The only way a ticket's status changes (non-negotiable 2). The legal moves are:
        `waiting → called | cancelled | transferred`; `called → waiting | in_progress | recalled |
        no_show | cancelled`; `recalled → in_progress | no_show | cancelled`; `in_progress → done |
        transferred`, where `cancelled`, `transferred` and `waiting` are made only by the cancel,
        transfer and undo-call routes. `done`, `no_show`, `cancelled` and `transferred` never
        change again: a correction is a new ticket. Every move is audited with the actor. Concurrent
        moves on one ticket are serialised; the second is judged against the status the first left.
        A repeated `Idempotency-Key` answers with the first request's ticket and moves nothing.
        Requires `queues.tickets` `update` at this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - name: ticket_id
          in: path
          required: true
          description: A ticket at this clinic.
          schema: { type: string }
          example: 01a09cf1-951b-7278-a2be-5fe7590abe56
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionIn" }
            example: { to: in_progress, expected_status: called }
      responses:
        "200":
          description: The moved ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketOut" }
              example:
                id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                number: T005
                reference_code: K7M-4QP
                source: web
                status: in_progress
                service_day: "2026-09-14"
                joined_at: "2026-09-14T07:31:12+02:00"
                walk_in_name: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            The move was refused and nothing changed. `code` is `ticket.transition.illegal` when the
            table does not allow it from the ticket's current status, `ticket.transition.stale`
            when `expected_status` no longer matches because someone else moved the ticket first,
            `ticket.transition.dedicated_route` when `to` is `cancelled`, `transferred` or `waiting`:
            those are made by the cancel, transfer and undo-call routes, which record the channel,
            issue the ticket in the next queue, or check the undo window, or
            `ticket.request.key_reused` when the `Idempotency-Key` was already used for another
            action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                illegal:
                  value: { detail: "A done ticket cannot change any more.", code: "ticket.transition.illegal" }
                stale:
                  value: { detail: "This ticket is now called, not waiting. Refresh and try again.", code: "ticket.transition.stale" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/queues/{queue_id}/tickets/call-next:
    post:
      tags: [queue]
      operationId: queueCallNext
      summary: Call the next waiting ticket in a queue
      description: |
        Calls the first waiting ticket today in call order (arrival order, whatever the channel).
        Two staff pressing it at the same instant call two different tickets; one person pressing
        it twice with the same `Idempotency-Key` (a double tap, a retried request) calls one, and
        the repeat answers with that ticket. Requires `queues.call` `update`: any queue here for the
        front desk, their own queues for a nurse.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/QueueId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The ticket now called.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketOut" }
              example:
                id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                number: T005
                reference_code: K7M-4QP
                source: web
                status: called
                service_day: "2026-09-14"
                joined_at: "2026-09-14T07:31:12+02:00"
                walk_in_name: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Nothing was called. `code` is `ticket.call_next.empty` when nobody is waiting in this queue
            today, or `ticket.request.key_reused` when the `Idempotency-Key` was already used for
            another action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Nobody is waiting in this queue.", code: "ticket.call_next.empty" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/tickets/{ticket_id}/undo-call:
    post:
      tags: [queue]
      operationId: queueUndoCall
      summary: Undo a call made by mistake, within the undo window
      description: |
        Puts a patient called by mistake back in the same place in the line (`called → waiting`).
        Only a `called` ticket, and only within `QUEUE_CALL_UNDO_SECONDS` (30 by default) of the
        call: after that the patient may be on their way, so staff recall them or mark a no-show
        instead. The ticket's call time is cleared; the audit trail keeps both the call and its
        undoing. Requires `queues.call` `update`: any queue here for the front desk, their own queues
        for a nurse.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The ticket, waiting again in its place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketOut" }
              example:
                id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                number: T005
                reference_code: K7M-4QP
                source: web
                status: waiting
                service_day: "2026-09-14"
                joined_at: "2026-09-14T07:31:12+02:00"
                walk_in_name: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Nothing changed. `code` is `ticket.undo.window_closed` when the call is older than the
            undo window, `ticket.transition.stale` when the ticket is no longer `called` (started,
            recalled, cancelled), or `ticket.request.key_reused` when the `Idempotency-Key` was
            already used for another action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                window_closed:
                  value:
                    detail: "T005 was called more than 30 seconds ago, so the call can no longer be undone. Recall them, or mark them a no-show if they do not come."
                    code: "ticket.undo.window_closed"
                stale:
                  value: { detail: "This ticket is now in_progress, not called. Refresh and try again.", code: "ticket.transition.stale" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/queues/{queue_id}/tickets/next:
    get:
      tags: [queue]
      operationId: queueNextTicket
      summary: Who would be called next in a queue
      description: The waiting ticket *Call next* would call now, or `null`. Moves nothing. Requires `queues.call` `read`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/QueueId" }
      responses:
        "200":
          description: The next ticket, or null when nobody is waiting.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/TicketOut" }
                  - { type: "null" }
              example:
                id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                number: T005
                reference_code: K7M-4QP
                source: web
                status: waiting
                service_day: "2026-09-14"
                joined_at: "2026-09-14T07:31:12+02:00"
                walk_in_name: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Clinical priority (Issue 46) ────────────────────────────────────────────────────────
  /sites/{site_id}/tickets/{ticket_id}/priority:
    post:
      tags: [queue]
      operationId: queuePriorityOverride
      summary: Move a waiting patient forward for clinical priority, with a reason
      description: |
        Places a waiting patient just ahead of another **waiting** ticket in the same queue. A
        `reason` is required and is a closed `PriorityReason`: without one the request is a 422 and
        nothing is saved. Naming a ticket that is already called, recalled or in progress is refused
        (409, `ticket.priority.ahead_of_called`), because nobody may be moved ahead of a patient being
        seen. Each override writes a `queue_reorder` row (place before and after, staff, reason) and an
        audit row. The positions of everyone else are derived, so no other ticket changes. Nothing
        about priority is ever returned to a patient or shown on the public board. Requires
        `queues.tickets.priority` `update`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriorityIn" }
            example: { ahead_of_ticket_id: 01a09cf1-9563-7512-aebc-6e2b4b0beb58, reason: visibly_unwell, note: "short of breath" }
      responses:
        "200":
          description: The patient's new place, and the record of the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriorityOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Refused, nothing changed: `ticket.priority.ahead_of_called`, `ticket.priority.not_waiting`,
            `ticket.priority.not_forward` or `ticket.priority.other_queue`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "A patient cannot be moved ahead of someone who has already been called or is being seen.", code: "ticket.priority.ahead_of_called" }
        "422":
          description: |
            No reason code (or one outside the list), or another field failed validation. Nothing is
            saved. Over HTTP the request validation answers first; a caller of the service itself is
            refused with `ticket.priority.reason_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /sites/{site_id}/tickets/lookup:
    get:
      tags: [queue]
      operationId: queueTicketLookup
      summary: The ticket a scanned QR or a typed reference code opens (Issue 70)
      description: |
        Resolves what a desk scanner or a receptionist typed: the QR's `CLINICQ:K7M-4QP`, or `K7M-4QP`, or
        `k7m 4qp`. Only this clinic's tickets and only today's. A transferred ticket's code opens the leg the
        visit is in now, naming the ticket it moved on from. Refusals are the error envelope with `code`
        `queue.lookup.<reason>`: `not_a_code` (422), `not_found` (404, also for another clinic's code, so a
        code cannot be probed for), `expired` (422, a code from an earlier service day, naming the day) and
        `ended` (409, the ticket has ended and its code cannot be used again). Requires `queues.tickets` `read`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 }, example: "CLINICQ:K7M-4QP" }
      responses:
        "200":
          description: The ticket, where it stands, and a sentence for the desk.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketLookupOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No ticket at this clinic has the code (`queue.lookup.not_found`), or not a clinic this caller works at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No ticket at this clinic has the code K7M-4QP. Check it with the patient.", code: "queue.lookup.not_found" }
        "409":
          description: The ticket has ended (`queue.lookup.ended`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Ticket T004 (K7M-4QP) has ended: done. Its code cannot be used again.", code: "queue.lookup.ended" }
        "422":
          description: Not a ticket code (`queue.lookup.not_a_code`), a code from an earlier day (`queue.lookup.expired`), or a missing parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Code K7M-4QP was for Monday 14 September 2026. A ticket code works only on the day it was issued: the patient needs a new ticket today.", code: "queue.lookup.expired" }

  /sites/{site_id}/tickets/reorders:
    get:
      tags: [queue]
      operationId: queueReorderTrail
      summary: The clinic's priority overrides today
      description: Every override made today at this clinic, newest first. The clinic manager's dashboard trail (Issue 52). Requires `queues.tickets.priority` `read`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
      responses:
        "200":
          description: Today's overrides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderTrailOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/tickets/reorders/counts:
    get:
      tags: [queue]
      operationId: queueOverrideCounts
      summary: How often each staff member used a priority override (not a ranking)
      description: |
        Counts per staff member over a period (the last 30 days by default), **listed by name, never
        by count**, with a note saying the counts describe use of a clinical tool and are not a
        measure of anybody's performance. Requires `sites.reports` `read` (the clinic manager).
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { name: start, in: query, required: false, schema: { type: [string, "null"], format: date } }
        - { name: end, in: query, required: false, schema: { type: [string, "null"], format: date } }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverrideCountsOut" }
              example:
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                start: "2026-08-16"
                end: "2026-09-14"
                items:
                  - { staff: "desk.a@clinicq.example", overrides: 1 }
                  - { staff: "manager.a@clinicq.example", overrides: 2 }
                note: "How often each staff member used a priority override. Overrides are clinical judgements, and these counts are not a measure of anybody's performance; they are listed by name, not by count."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Transfers and visits (Issue 45) ─────────────────────────────────────────────────────
  /sites/{site_id}/tickets/{ticket_id}/transfer:
    post:
      tags: [queue]
      operationId: queueTransferTicket
      summary: Move a patient to another queue without rejoining
      description: |
        Moves a `waiting` or `in_progress` ticket to another queue at the same clinic. The ticket left
        behind becomes `transferred`; a new ticket is issued in the target queue from its own sequence,
        in the same visit, pointing back with `transferred_from_id`. Where the patient lands is the
        clinic's `transfer_placement`: `arrival_order` (by when the visit began, the default) or
        `back_of_line`. The patient is sent the new queue, number and wait. Both tickets are audited
        with the staff member and the reason. A refusal changes nothing. Requires `queues.tickets`
        `update` at this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferIn" }
            example: { queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3e, reason: next_step }
      responses:
        "200":
          description: The patient is in the new queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferOut" }
              example:
                from_ticket:
                  id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T005
                  reference_code: K7M-4QP
                  source: web
                  status: transferred
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                ticket:
                  id: 01a09cf1-9563-7512-aebc-6e2b4b0beb59
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3e
                  number: A012
                  reference_code: K7M-4QP
                  source: web
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                visit_id: 01a09cf1-94f8-73c5-b87a-cfcac3909999
                waiting_ahead: 3
                wait: { low_minutes: 15, high_minutes: 30, confidence: medium, approximate: false, label: "~15–30 min" }
                message: "Moved to General consultation as A012. Expected wait ~15–30 min."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Refused, and nothing changed. `ticket.transfer.queue_closed` (the target is not taking
            patients), `ticket.transfer.queue_full`, `ticket.transfer.same_queue`,
            `ticket.transfer.already_there` (the patient already holds a ticket there), or
            `ticket.transition.illegal` when the ticket cannot be transferred from its status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                closed:
                  value: { detail: "This queue is not taking patients at the moment.", code: "ticket.transfer.queue_closed" }
                full:
                  value: { detail: "That queue is full for today. Choose another queue.", code: "ticket.transfer.queue_full" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/visits:
    get:
      tags: [queue]
      operationId: queueVisits
      summary: The clinic's visits today
      description: Every visit that began today at this clinic, earliest first, with its legs. Requires `queues.tickets` `read`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
      responses:
        "200":
          description: Today's visits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitListOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/visits/{visit_id}:
    get:
      tags: [queue]
      operationId: queueVisit
      summary: One patient's journey through the clinic
      description: |
        The visit's tickets in the order they were issued, when it began, and, once its last leg is
        finished (anything terminal but `transferred`), when it ended and its total minutes.
        Requires `queues.tickets` `read`.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - name: visit_id
          in: path
          required: true
          schema: { type: string }
          example: 01a09cf1-94f8-73c5-b87a-cfcac3909999
      responses:
        "200":
          description: The visit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitOut" }
              example:
                id: 01a09cf1-94f8-73c5-b87a-cfcac3909999
                site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                started_at: "2026-09-14T07:31:12+02:00"
                ended_at: "2026-09-14T09:02:40+02:00"
                total_minutes: 91.5
                legs:
                  - { ticket_id: 01a09cf1-0000-7000-8000-000000000001, queue_id: 01a09c0b-0000-7000-8000-00000000000a, number: T005, status: transferred, joined_at: "2026-09-14T07:31:12+02:00", called_at: "2026-09-14T07:40:00+02:00", completed_at: "2026-09-14T07:52:00+02:00", transferred_from_id: null }
                  - { ticket_id: 01a09cf1-0000-7000-8000-000000000002, queue_id: 01a09c0b-0000-7000-8000-00000000000b, number: A012, status: transferred, joined_at: "2026-09-14T07:52:00+02:00", called_at: "2026-09-14T08:20:00+02:00", completed_at: "2026-09-14T08:41:00+02:00", transferred_from_id: 01a09cf1-0000-7000-8000-000000000001 }
                  - { ticket_id: 01a09cf1-0000-7000-8000-000000000003, queue_id: 01a09c0b-0000-7000-8000-00000000000c, number: P007, status: done, joined_at: "2026-09-14T08:41:00+02:00", called_at: "2026-09-14T08:55:00+02:00", completed_at: "2026-09-14T09:02:40+02:00", transferred_from_id: 01a09cf1-0000-7000-8000-000000000002 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Giving a place back (Issue 44) ──────────────────────────────────────────────────────
  /patients/me/tickets/{ticket_id}/cancel:
    post:
      tags: [queue]
      operationId: queueCancelMyTicket
      summary: Give my place back
      description: |
        Cancels one of the signed-in patient's own tickets while it is still **waiting**. Once the
        patient has been called it is refused (`ticket.cancel.after_call`) with a sentence telling
        them to speak to reception. Everyone waiting behind moves up one place: positions are derived
        from the order of the waiting tickets, never stored, so the next read of any ticket shows it.
        USSD and WhatsApp cancel through the same service. Another patient's ticket is the same 404 as
        one that does not exist.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/TicketId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelIn" }
            example: { reason: wait_too_long }
      responses:
        "200":
          description: The cancelled ticket, and how many patients moved up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelOut" }
              example:
                ticket:
                  id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T003
                  reference_code: K7M-4QP
                  source: web
                  status: cancelled
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                moved_up: 7
                message: "Ticket T003 is cancelled. Thank you for giving your place back: 7 people moved up."
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not one of this patient's tickets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such ticket.", code: "http.not_found" }
        "409":
          description: Already called (speak to reception), or already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                after_call:
                  value: { detail: "You have already been called, so this ticket can no longer be cancelled from your phone. Please speak to reception.", code: "ticket.cancel.after_call" }
                finished:
                  value: { detail: "A done ticket cannot change any more.", code: "ticket.transition.illegal" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /patients/me/tickets/{ticket_id}/on-my-way:
    post:
      tags: [queue]
      operationId: queueOnMyWay
      summary: Tell reception I am on my way
      description: |
        The virtual waiting room's acknowledgement (Issue 86), usually after "time to leave". Reception
        sees it beside the ticket at once. Idempotent: a second tap keeps the first time. Nothing about the
        ticket's place changes, and not tapping it never costs the place. Another patient's ticket is the
        same 404 as one that does not exist.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/TicketId" }
      responses:
        "200":
          description: The ticket, with `on_my_way_at` set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnMyWayOut" }
              example:
                ticket:
                  id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T003
                  reference_code: K7M-4QP
                  source: web
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                  travel_minutes: 30
                  leave_alert_at: "2026-09-14T09:40:31+02:00"
                  on_my_way_at: "2026-09-14T09:41:02+02:00"
                message: Reception knows T003 is on the way.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not one of this patient's tickets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such ticket.", code: "http.not_found" }
        "409":
          description: The clinic has no virtual waiting room, or the visit has begun or ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_offered:
                  value: { detail: "This clinic is not waiting for patients to travel in.", code: "ticket.on_my_way.not_offered" }
                ended:
                  value: { detail: "This ticket is no longer in the queue.", code: "ticket.on_my_way.ended" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/tickets/{ticket_id}/cancel:
    post:
      tags: [queue]
      operationId: queueCancelTicketAtDesk
      summary: Cancel a ticket at the front desk
      description: |
        Cancels a ticket for a patient at reception, including one that has already been called.
        Recorded with the front desk as its channel and the staff member as its actor. Requires
        `queues.tickets` `update` at this clinic.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelIn" }
            example: { reason: null }
      responses:
        "200":
          description: The cancelled ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: Already finished; a correction is a new ticket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "A done ticket cannot change any more.", code: "ticket.transition.illegal" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /patients/me/tickets:
    get:
      tags: [queue]
      operationId: queueMyTickets
      summary: The signed-in patient's tickets today, with where each stands
      description: |
        The patient's own tickets today, at any clinic, earliest first. A waiting ticket carries
        `waiting_ahead` and `wait`, derived from the queue as it is at this read: a cancellation ahead
        shows here on the next read. (Pushing it to an open page without a reload is the board stream,
        Issue 57.)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200":
          description: Today's tickets, possibly none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyTicketOut" }
              example:
                - id: 01a09cf1-951b-7278-a2be-5fe7590abe56
                  site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
                  queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
                  number: T005
                  reference_code: K7M-4QP
                  source: web
                  status: waiting
                  service_day: "2026-09-14"
                  joined_at: "2026-09-14T07:31:12+02:00"
                  walk_in_name: null
                  waiting_ahead: 3
                  wait: { low_minutes: 10, high_minutes: 20, confidence: medium, approximate: false, label: "~10–20 min" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── The patient's ticket page (Issue 68) ────────────────────────────────────────────────
  /tickets/{page_token}:
    get:
      tags: [queue]
      operationId: queueTicketPage
      summary: One ticket as its page shows it, found by the page's unguessable link
      description: |
        The data behind the patient's ticket page at `/t/{page_token}`: number, clinic, queue, place in
        line, wait range and a headline that says what to do now. No sign-in: the token (43 URL-safe
        characters, 256 random bits) is the credential, and it lets its holder follow the ticket and
        nothing more. It carries nothing about the patient (no name, phone number or reason).

        `cancel_url` is set only when the ticket's own patient is signed in on the browser asking and
        the ticket is still waiting; the cancel route checks again. A ticket id, number or reference
        code is not a token, and every link that finds nothing is the same `404`.

        The page follows `/t/{page_token}/stream`: server-sent `ticket.state` events carrying this
        object as `ticket`, in the waiting-room board's envelope (Issue 57), with a heartbeat every
        15 seconds. While the stream is down it reads this route every `refresh_seconds`.
      parameters:
        - name: page_token
          in: path
          required: true
          description: The ticket page's token, from `page_url` in the join answer or the patient's tickets.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
          example: 3q2X9vJp0kQy7W1mZ5nR8tB4cD6eF2gH0iJkLmNoPqR
      responses:
        "200":
          description: The ticket as it stands now. Never cached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPageOut" }
              example:
                number: T005
                reference_code: K7M-4QP
                reference_qr: { payload: "CLINICQ:K7M-4QP", size: 29, path: "M4 4h7v1h-7zM12 4h2v1h-2z" }
                reference_spoken: "Kilo 7 Mike, 4 Quebec Papa"
                headline: waiting
                status: waiting
                service_day: "2026-09-15"
                clinic:
                  name: Zola Community Clinic
                  address: "1 Main Road, Zola, Soweto"
                  phone_e164: "+27110000000"
                  call_url: "tel:+27110000000"
                  directions_url: "https://www.google.com/maps/dir/?api=1&destination=-26.244000,27.855000"
                queue: { name: Triage, room: Room 2 }
                position: 4
                waiting_ahead: 3
                wait: { low_minutes: 10, high_minutes: 20, confidence: medium, approximate: false, label: "~10–20 min" }
                called_at: null
                as_of: "2026-09-15T08:41:05+02:00"
                refresh_seconds: 15
                stale_after_seconds: 45
                stream_url: /t/3q2X9vJp0kQy7W1mZ5nR8tB4cD6eF2gH0iJkLmNoPqR/stream
                cancel_url: null
                next_page_url: null
        "404":
          description: No ticket has this link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such ticket.", code: "http.not_found" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Private visit notes (Issue 53) ──────────────────────────────────────────────────────
  /sites/{site_id}/tickets/{ticket_id}/notes:
    get:
      tags: [queue]
      operationId: visitNotesForTicket
      summary: The private notes of a ticket's visit (clinicians only)
      description: |
        This visit's notes, oldest first, including notes written in another queue before a
        transfer, and the patient's notes from **earlier visits to this clinic** only if the patient
        agreed (`visit_note_history` consent); otherwise `previous` is `null` and `previous_withheld`
        says why. A note past its retention window is never returned. Requires `visits.notes` `read`,
        which only a nurse or doctor holds, on **their own rooms**: another room's ticket is the same
        404 as another clinic's. Nothing here is ever shown on a board or to a patient.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNotesOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [queue]
      operationId: visitNoteAdd
      summary: Add a private note to a ticket's visit (clinicians only)
      description: |
        Adds one note, attributed to the caller and timestamped, stored encrypted and deleted after
        `VISIT_NOTE_RETENTION_DAYS` (30 by default). Notes are never edited: a correction is another
        note. A note on a patient who has not been seen (waiting, cancelled, no-show) is refused. The
        audit row records that a note was added and by whom, never its words. Requires `visits.notes`
        `update` on the caller's own rooms.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SiteId" }
        - { $ref: "#/components/parameters/TicketId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitNoteIn" }
            example: { text: "BP 150/95, asked to return Friday for a recheck." }
      responses:
        "201":
          description: The note as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNoteOut" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SiteNotFound" }
        "409":
          description: |
            Refused, nothing written: `ticket.note.not_seen` (the patient is waiting, cancelled or a
            no-show at this ticket).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "A visit note is written once the patient has been called, not before.", code: "ticket.note.not_seen" }
        "422": { $ref: "#/components/responses/Unprocessable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from the staff or patient sign-in.
    sessionCookie:
      type: apiKey
      in: cookie
      name: bk_clinicq_access_token
      description: |
        The browser session. An unsafe request must also echo the readable CSRF cookie
        (`bk_clinicq_csrf`) in `X-CSRF-Token`.

  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      description: The clinic.
      schema: { type: string }
      example: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: A ticket.
      schema: { type: string }
      example: 01a09cf1-951b-7278-a2be-5fe7590abe56
    QueueId:
      name: queue_id
      in: path
      required: true
      description: One of the clinic's queues.
      schema: { type: string }
      example: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A fresh random value per intended action (a UUID), sent again only when retrying that same
        action. A repeat from the same person for the same action answers with the first request's
        ticket and moves nothing, so a double tap or a retried request never acts twice. Keys are kept
        for a day.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      example: 3f0c9a8e-2b6d-4d4f-9a51-7c1e2f8b6a40

  responses:
    Unauthenticated:
      description: No session, or an expired one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Not authenticated" }
    Forbidden:
      description: Signed in, without the grant this route needs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Forbidden", code: "insufficient_permission" }
    SiteNotFound:
      description: Not a clinic this caller works at, or no such clinic or queue. The two are indistinguishable on purpose.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Not found.", code: "http.not_found" }
    Unprocessable:
      description: A field failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    JoinRefused:
      description: |
        The join was refused. `code` is `queue.join.` followed by a `JoinRefusal`, and `detail` is a
        sentence a patient can be shown as it stands:

        - `queue.join.clinic_closed`: the clinic is closed now, closed for an announced reason, or not taking patients through ClinicQ;
        - `queue.join.queue_closed`: the queue is not taking patients at the moment;
        - `queue.join.walk_in_only`: the queue takes walk-ins only, and the join came from a phone;
        - `queue.join.queue_full`: the queue has issued its capacity for today;
        - `queue.join.site_daily_cap`: the clinic is taking no more joins by phone today.

        Rate limiting is not a 409: over HTTP it is `429` with `Retry-After` and `http.too_many_requests`.
        A channel adapter calling the join service directly receives it as `queue.join.rate_limited`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Hillbrow Community Health Centre is closed: Water outage", code: "queue.join.clinic_closed" }

  schemas:
    # ── Errors ────────────────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: A sentence a person can act on. }
        code: { type: string, description: A stable machine-readable code, when the handler sets one. }
        request_id: { type: string, description: This request's id, for correlating with the logs. }
      example: { detail: "This queue takes walk-in patients only. Please join at the clinic's front desk.", code: "queue.join.walk_in_only" }
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                required: [loc, msg, type]
                properties:
                  loc: { type: array, items: { anyOf: [{ type: string }, { type: integer }] } }
                  msg: { type: string }
                  type: { type: string }
      example:
        detail:
          - loc: [body, reason_text]
            msg: "String should have at most 140 characters"
            type: string_too_long

    # ── Vocabularies ─────────────────────────────────────────────────────────────────────
    TicketStatus:
      type: string
      description: Where a ticket is in its lifecycle. Written only by the lifecycle (Issue 41).
      enum: [waiting, called, recalled, in_progress, done, no_show, cancelled, transferred]
      example: waiting
    TicketSource:
      type: string
      description: The door a ticket came through. Recorded for reporting; never used to order the queue.
      enum: [web, ussd, whatsapp, walk_in]
      example: walk_in
    JoinRefusal:
      type: string
      description: Why a join was refused; the suffix of the error `code`.
      enum: [clinic_closed, queue_closed, walk_in_only, queue_full, site_daily_cap, rate_limited]
      example: queue_full

    # ── Requests ─────────────────────────────────────────────────────────────────────────
    JoinIn:
      type: object
      properties:
        reason_text:
          type: [string, "null"]
          maxLength: 140
          description: A short reason for the visit, optional. Trimmed; an empty one is none.
        comment_consent:
          type: boolean
          default: false
          description: Consent, for this visit only, to show the reason on the waiting-room board.
        travel_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 180
          description: |
            How long the trip to the clinic takes, at a clinic with a virtual waiting room (Issue 86).
            `0` is "already here"; null takes the default (15). Not kept at a clinic without one.
      example: { reason_text: null, comment_consent: false, travel_minutes: 30 }
    WalkInIn:
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 80, description: "What the desk calls the patient by. Never on the public board." }
        reason_text: { type: [string, "null"], maxLength: 140 }
        comment_consent: { type: boolean, default: false }
        phone:
          type: [string, "null"]
          maxLength: 20
          description: Optional. Any South African form (`082 123 4567`, `+27821234567`); links the walk-in to that patient.
        notifications_consent:
          type: boolean
          default: false
          description: The patient's answer, asked at the desk, to being messaged about their turn. Recorded as their `notifications` consent. Only with a `phone` (otherwise `422`).
      example: { name: null, reason_text: "Chest pain", comment_consent: true, phone: "082 123 4567", notifications_consent: true }

    TransitionIn:
      type: object
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/TicketStatus" }
        expected_status:
          description: The status on the caller's screen; a move is refused as stale when the ticket has moved on.
          oneOf:
            - { $ref: "#/components/schemas/TicketStatus" }
            - { type: "null" }
      example: { to: called, expected_status: waiting }

    # ── Responses ────────────────────────────────────────────────────────────────────────
    TicketOut:
      type: object
      required: [id, site_id, queue_id, number, reference_code, source, status, service_day, joined_at, walk_in_name]
      properties:
        id: { type: string }
        site_id: { type: string }
        queue_id: { type: string }
        number: { type: string, pattern: "^[A-Z]{1,4}[0-9]{3,}$", description: "The prefix and the day's sequence." }
        reference_code: { type: string, pattern: "^[2-9A-HJKMNP-Z]{3}-[2-9A-HJKMNP-Z]{3}$", description: "Six unambiguous characters in two groups." }
        source: { $ref: "#/components/schemas/TicketSource" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        service_day: { type: string, format: date }
        joined_at: { type: string, format: date-time }
        walk_in_name: { type: [string, "null"], description: "The desk's name for a walk-in; null for a phone join." }
        travel_minutes: { type: [integer, "null"], description: "The stated trip, at a clinic with a virtual waiting room (Issue 86)." }
        leave_alert_at: { type: [string, "null"], format: date-time, description: "When the patient was told it is time to leave." }
        on_my_way_at: { type: [string, "null"], format: date-time, description: "When the patient said they are on their way: what reception looks for." }
      example:
        id: 01a09cf1-951b-7278-a2be-5fe7590abe56
        site_id: 01a09c0b-ce1c-743e-b8ff-544bb4ac8774
        queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
        number: T005
        reference_code: K7M-4QP
        source: ussd
        status: waiting
        service_day: "2026-09-14"
        joined_at: "2026-09-14T07:31:12+02:00"
        walk_in_name: null
    WaitOut:
      type: object
      required: [low_minutes, high_minutes, confidence, approximate, label]
      description: |
        How long to expect to wait: always a range, never one number (Issue 42). Built from the
        queue's recent visits, or, while it has too few, from its expected minutes, in which case
        `approximate` is true, `confidence` is `low` and `label` says "(approximate)".
      properties:
        low_minutes: { type: integer, minimum: 0 }
        high_minutes: { type: integer, minimum: 1 }
        confidence: { $ref: "#/components/schemas/EstimateConfidence" }
        approximate: { type: boolean }
        label: { type: string, description: 'The range as every surface shows it: "~15–25 min".' }
      example: { low_minutes: 15, high_minutes: 25, confidence: high, approximate: false, label: "~15–25 min" }
    EstimateConfidence:
      type: string
      enum: [low, medium, high]
      example: medium
    JoinOut:
      type: object
      required: [ticket, created, waiting_ahead, wait, message]
      properties:
        ticket: { $ref: "#/components/schemas/TicketOut" }
        created: { type: boolean, description: "False when the patient already held this ticket." }
        waiting_ahead: { type: integer, minimum: 0, description: "Waiting tickets ahead of this one now." }
        wait: { $ref: "#/components/schemas/WaitOut" }
        message: { type: string, description: "A sentence for the patient." }
        page_url: { type: [string, "null"], description: "The ticket page, to follow live and share (Issue 68)." }
    TicketPageHeadline:
      type: string
      description: What a ticket page leads with, derived from the status and the place in line (Issue 68).
      enum: [waiting, next, called, in_progress, done, cancelled, missed, transferred]
      example: next
    TicketQrOut:
      type: object
      description: A ticket's QR as drawable data (Issue 70), the same on the ticket page, its offline copy and the printed stub.
      required: [payload, size, path]
      properties:
        payload: { type: string, pattern: "^CLINICQ:[2-9A-HJKMNP-Z]{3}-[2-9A-HJKMNP-Z]{3}$", description: "What the QR says: the reference code behind ClinicQ's prefix." }
        size: { type: integer, minimum: 1, description: "The side of the square in modules, quiet margin included." }
        path: { type: string, description: "The dark modules as one SVG path in size units." }
    TicketLookupOut:
      type: object
      required: [ticket, queue_name, room_label, reference_spoken, message]
      properties:
        ticket: { $ref: "#/components/schemas/TicketOut" }
        queue_name: { type: string }
        room_label: { type: [string, "null"] }
        waiting_ahead: { type: [integer, "null"], minimum: 0, description: "How many are ahead while the ticket waits." }
        wait:
          oneOf:
            - { $ref: "#/components/schemas/WaitOut" }
            - { type: "null" }
        reference_spoken: { type: string, description: "The code as read aloud: Kilo 7 Mike, 4 Quebec Papa." }
        followed_from: { type: [string, "null"], description: "The number of the ticket whose code this was, when a transfer moved the visit on." }
        message: { type: string, description: "A sentence for the desk." }
    TicketPageOut:
      type: object
      required: [number, reference_code, reference_qr, reference_spoken, headline, status, service_day, clinic, queue, as_of, refresh_seconds, stale_after_seconds, stream_url, cancel_url, next_page_url]
      properties:
        number: { type: string }
        reference_code: { type: string, description: "Written the way it is read aloud: K7M-4QP." }
        headline: { $ref: "#/components/schemas/TicketPageHeadline" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        service_day: { type: string, format: date }
        clinic:
          type: object
          required: [name, address, phone_e164, call_url, directions_url]
          properties:
            name: { type: string }
            address: { type: string }
            phone_e164: { type: [string, "null"] }
            call_url: { type: [string, "null"], description: "A tel: link; null when the clinic has no number." }
            directions_url: { type: string }
        queue:
          type: object
          required: [name, room]
          properties:
            name: { type: string }
            room: { type: [string, "null"] }
        position: { type: [integer, "null"], minimum: 1, description: "Place in the waiting line, 1 being next; null once not waiting." }
        waiting_ahead: { type: [integer, "null"], minimum: 0 }
        wait:
          oneOf:
            - { $ref: "#/components/schemas/WaitOut" }
            - { type: "null" }
        called_at: { type: [string, "null"], format: date-time }
        as_of: { type: string, format: date-time, description: "When this was read; the page shows how old it is." }
        refresh_seconds: { type: integer, minimum: 1, description: "How often to read again while the stream is down." }
        stale_after_seconds: { type: integer, minimum: 1, description: "Silence after which the page says it is not live." }
        stream_url: { type: [string, "null"], description: "The live stream; null once the ticket is finished." }
        cancel_url: { type: [string, "null"], description: "Only for the ticket's own signed-in patient, while waiting." }
        next_page_url: { type: [string, "null"], description: "The page of the ticket a transfer issued." }
        push_key: { type: [string, "null"], description: "The VAPID key to subscribe this browser with (Issue 64); only for the ticket's own signed-in patient." }
        push_subscribe_url: { type: [string, "null"], description: "Where that subscription is sent; set exactly when push_key is." }
        reference_qr: { $ref: "#/components/schemas/TicketQrOut" }
        reference_spoken: { type: string, description: "The reference code as read aloud (Issue 70): Kilo 7 Mike, 4 Quebec Papa." }
        offer_install: { type: boolean, description: "Offer adding the app to the home screen (Issue 69): the ticket's own signed-in patient, while the ticket is open." }
        preferences_url: { type: [string, "null"], description: "The patient's message preferences by this link (Issue 67); null for a walk-in with no patient." }
        call_forward:
          oneOf:
            - $ref: "#/components/schemas/CallForwardOut"
            - type: "null"
          description: The virtual waiting room (Issue 86), for a travelling patient at a clinic that runs one.
        feedback:
          type: [object, "null"]
          description: |
            The post-visit question (Issue 87), for the ticket's own patient once the visit is done and the question
            was sent; the same shape as `FeedbackRequestOut` in contracts/feedback.yaml. One tap on a score posts to
            its `answer_url`.
    CallForwardOut:
      type: object
      required: [travel_minutes, leave_at, due, alerted_at, on_my_way_at, on_my_way_url]
      description: |
        When to leave, from the same estimate as the page's `wait`: due once the low end of the wait is no
        more than the trip plus 10 minutes. Once the ticket is called, `leave_at` is null and `due` true.
      properties:
        travel_minutes: { type: integer, minimum: 1 }
        leave_at: { type: [string, "null"], format: date-time }
        due: { type: boolean }
        alerted_at: { type: [string, "null"], format: date-time }
        on_my_way_at: { type: [string, "null"], format: date-time }
        on_my_way_url: { type: [string, "null"], description: "For the ticket's own patient until they have said it." }
      example:
        travel_minutes: 30
        leave_at: "2026-09-14T09:40:00+02:00"
        due: false
        alerted_at: null
        on_my_way_at: null
        on_my_way_url: /api/v1/patients/me/tickets/01a09cf1-951b-7278-a2be-5fe7590abe56/on-my-way
    OnMyWayOut:
      type: object
      required: [ticket, message]
      properties:
        ticket: { $ref: "#/components/schemas/TicketOut" }
        message: { type: string }
    PriorityReason:
      type: string
      description: Why a patient was moved forward. Required for every override; never free text.
      enum: [visibly_unwell, elderly, infant, pregnancy, staff_referral, other]
      example: visibly_unwell
    PriorityIn:
      type: object
      required: [ahead_of_ticket_id, reason]
      properties:
        ahead_of_ticket_id: { type: string, description: "A waiting ticket in the same queue." }
        reason: { $ref: "#/components/schemas/PriorityReason" }
        note: { type: [string, "null"], maxLength: 140, description: "A few optional words beside the reason. Redacted in the audit trail." }
      example: { ahead_of_ticket_id: 01a09cf1-9563-7512-aebc-6e2b4b0beb58, reason: elderly, note: null }
    ReorderOut:
      type: object
      required: [id, ticket_id, queue_id, staff, reason, note, position_before, position_after, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        queue_id: { type: string }
        staff: { type: string }
        reason: { $ref: "#/components/schemas/PriorityReason" }
        note: { type: [string, "null"] }
        position_before: { type: integer, minimum: 1 }
        position_after: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
      example:
        id: 01a09cf1-0000-7000-8000-00000000r001
        ticket_id: 01a09cf1-951b-7278-a2be-5fe7590abe56
        queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
        staff: "desk.a@clinicq.example"
        reason: visibly_unwell
        note: "short of breath"
        position_before: 7
        position_after: 2
        created_at: "2026-09-14T08:02:11+02:00"
    PriorityOut:
      type: object
      required: [ticket, reorder, waiting_ahead]
      properties:
        ticket: { $ref: "#/components/schemas/TicketOut" }
        reorder: { $ref: "#/components/schemas/ReorderOut" }
        waiting_ahead: { type: integer, minimum: 0 }
    VisitNoteIn:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
    VisitNoteOut:
      type: object
      required: [id, ticket_id, visit_id, queue_id, author, text, created_at, expires_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        visit_id: { type: string }
        queue_id: { type: string }
        author: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      example:
        id: 01a09cf1-0000-7000-8000-00000000n001
        ticket_id: 01a09cf1-951b-7278-a2be-5fe7590abe56
        visit_id: 01a09cf1-951b-7278-a2be-5fe7590abe57
        queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3d
        author: "nurse.a@clinicq.example"
        text: "BP 150/95, asked to return Friday for a recheck."
        created_at: "2026-09-14T10:12:00+02:00"
        expires_at: "2026-10-14T10:12:00+02:00"
    VisitNotesOut:
      type: object
      required: [ticket_id, visit_id, notes, previous, previous_withheld]
      properties:
        ticket_id: { type: string }
        visit_id: { type: string }
        notes: { type: array, items: { $ref: "#/components/schemas/VisitNoteOut" } }
        previous:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/VisitNoteOut" }
        previous_withheld: { type: [string, "null"] }
    ReorderTrailOut:
      type: object
      required: [site_id, service_day, total, items]
      properties:
        site_id: { type: string }
        service_day: { type: string, format: date }
        total: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: "#/components/schemas/ReorderOut" } }
    OverrideCountsOut:
      type: object
      required: [site_id, start, end, items, note]
      properties:
        site_id: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        items:
          type: array
          description: Listed by staff name, never by count.
          items:
            type: object
            required: [staff, overrides]
            properties:
              staff: { type: string }
              overrides: { type: integer, minimum: 0 }
        note: { type: string }
    TransferReason:
      type: string
      description: Why staff moved a patient on. Required; never free text.
      enum: [next_step, referred, wrong_queue, other]
      example: next_step
    TransferIn:
      type: object
      required: [queue_id, reason]
      properties:
        queue_id: { type: string, description: "A queue at the same clinic." }
        reason: { $ref: "#/components/schemas/TransferReason" }
      example: { queue_id: 01a09c0b-ce5e-7037-8071-cd12f438bd3e, reason: next_step }
    TransferOut:
      type: object
      required: [from_ticket, ticket, visit_id, waiting_ahead, wait, message]
      properties:
        from_ticket: { $ref: "#/components/schemas/TicketOut" }
        ticket: { $ref: "#/components/schemas/TicketOut" }
        visit_id: { type: string }
        waiting_ahead: { type: integer, minimum: 0 }
        wait: { $ref: "#/components/schemas/WaitOut" }
        message: { type: string }
    VisitLegOut:
      type: object
      required: [ticket_id, queue_id, number, status, joined_at, called_at, completed_at, transferred_from_id]
      properties:
        ticket_id: { type: string }
        queue_id: { type: string }
        number: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        joined_at: { type: string, format: date-time }
        called_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        transferred_from_id: { type: [string, "null"] }
    VisitOut:
      type: object
      required: [id, site_id, started_at, ended_at, total_minutes, legs]
      properties:
        id: { type: string }
        site_id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time, description: "null while the visit is under way." }
        total_minutes: { type: [number, "null"], minimum: 0 }
        legs: { type: array, items: { $ref: "#/components/schemas/VisitLegOut" } }
    VisitListOut:
      type: object
      required: [site_id, service_day, total, items]
      properties:
        site_id: { type: string }
        service_day: { type: string, format: date }
        total: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: "#/components/schemas/VisitOut" } }
    CancellationReason:
      type: string
      description: Why a patient gave their place back, when they chose to say. Feeds the no-show analysis (Issue 93).
      enum: [feeling_better, wait_too_long, cannot_get_there, went_elsewhere, joined_by_mistake, other]
      example: wait_too_long
    CancelIn:
      type: object
      properties:
        reason:
          oneOf:
            - { $ref: "#/components/schemas/CancellationReason" }
            - { type: "null" }
      example: { reason: feeling_better }
    CancelOut:
      type: object
      required: [ticket, moved_up, message]
      properties:
        ticket: { $ref: "#/components/schemas/TicketOut" }
        moved_up: { type: integer, minimum: 0, description: "Patients still waiting behind, each now one place further forward." }
        message: { type: string }
    MyTicketOut:
      allOf:
        - { $ref: "#/components/schemas/TicketOut" }
        - type: object
          properties:
            waiting_ahead: { type: [integer, "null"], minimum: 0, description: "Waiting tickets ahead in call order; null once not waiting." }
            wait:
              oneOf:
                - { $ref: "#/components/schemas/WaitOut" }
                - { type: "null" }
            page_url: { type: [string, "null"], description: "The ticket page (Issue 68); null for a ticket older than the page." }
    TicketListOut:
      type: object
      required: [site_id, service_day, total, items]
      properties:
        site_id: { type: string }
        service_day: { type: string, format: date }
        total: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: "#/components/schemas/TicketOut" } }
