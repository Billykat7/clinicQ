# ClinicQ: the post-visit feedback contract (Issue 87).
#
# Hand-written from the router as it is, for the patient screens (C) and the M12 reports (F's Issues 89 and 94).
# Checked against the application's /openapi.json in both directions by
# tests/integration/contracts/test_openapi_contracts.py, which gives this contract every /feedback route and the
# clinic's /sites/{site_id}/reports/feedback (the sites contract cedes it).

openapi: 3.1.0

info:
  title: ClinicQ post-visit feedback
  version: "0.11.0"
  description: |
    One question after a completed visit, answered with one tap or one keypress, and a clinic's report.

    **The request** is made by the `done` transition, once per visit, through the notification service, so the
    patient's consent to the survey (`feedback_survey`), an opt-out, a muted message and quiet hours all apply. A
    request the service did not send is not answerable: its link is the same 404 as a made-up one.

    **Answering.** By SMS, a reply starting with a digit from 1 to 5 (anything after it is the comment). In a
    browser, `POST /feedback/{token}` from the answer page (`/f/{token}`, which a web push opens) or the patient's
    own ticket page. No sign-in: the link is the secret. A second answer is refused; the first stands. A comment is
    screened for phone numbers, e-mail addresses, ID numbers and codes before it is stored, and emptied after the
    clinic's patient-text retention window.

    **The report** (`sites.reports:read`) gives requests sent, answered, the response rate and the average score
    per clinic, queue and staff member, answers per channel, and the newest screened comments.

servers:
  - url: /api/v1
    description: This deployment.

tags:
  - name: feedback
    description: Post-visit feedback.

paths:
  /feedback/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 43, maxLength: 43 }
        description: The request's link secret, 256 random bits.
    get:
      tags: [feedback]
      operationId: feedbackRead
      summary: A post-visit question, by its link
      responses:
        "200":
          description: The question and whether it is still open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackRequestOut" }
              example:
                clinic: Hillbrow Community Health Centre
                question: How was your visit today?
                choices:
                  - { score: 1, label: Very poor }
                  - { score: 2, label: Poor }
                  - { score: 3, label: Okay }
                  - { score: 4, label: Good }
                  - { score: 5, label: Very good }
                answered: false
                score: null
                expired: false
                answer_url: /api/v1/feedback/Zw8bq3Yc0jM2Pz0f5rJk3vQmTq4mS7pD1xW9aE6uHnL
                max_comment_length: 500
        "404":
          description: No such request, or one that was never sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such feedback request.", code: feedback.not_found }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [feedback]
      operationId: feedbackAnswer
      summary: "Answer a post-visit question: one tap"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackAnswerIn" }
            example: { score: 4, comment: "The nurse explained everything." }
      responses:
        "200":
          description: The question, now answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackRequestOut" }
              example:
                clinic: Hillbrow Community Health Centre
                question: How was your visit today?
                choices:
                  - { score: 1, label: Very poor }
                  - { score: 2, label: Poor }
                  - { score: 3, label: Okay }
                  - { score: 4, label: Good }
                  - { score: 5, label: Very good }
                answered: true
                score: 4
                expired: false
                answer_url: null
                max_comment_length: 500
        "404":
          description: No such request, or one that was never sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "No such feedback request.", code: feedback.not_found }
        "409":
          description: Already answered (the first answer stands), or the question has closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                answered:
                  value: { detail: "Thank you, this visit has been rated already.", code: feedback.already_answered }
                expired:
                  value: { detail: "This question has closed. Thank you all the same.", code: feedback.expired }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sites/{site_id}/reports/feedback:
    parameters:
      - { name: site_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [feedback]
      operationId: feedbackReport
      summary: How patients rated their visits, and how many answered
      description: |
        `sites.reports:read`. Requests made from `start` to `end` (Johannesburg service days, the last 30 by
        default, at most 366). The per-staff breakdown follows who marked each visit done, alphabetically, never
        ranked. Comments are shown as stored: already screened, and gone once past retention.
      parameters:
        - { name: start, in: query, required: false, schema: { type: string, format: date } }
        - { name: end, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReportOut" }
              example:
                site_id: 01a0a6d4-417e-73ca-8a16-d9d2d2a3d669
                start: "2026-08-17"
                end: "2026-09-15"
                overall: { sent: 40, answered: 14, response_rate: 0.35, average_score: 4.21 }
                distribution: { "1": 0, "2": 1, "3": 1, "4": 6, "5": 6 }
                suppressed: 12
                by_queue:
                  - id: 01a0a6d4-4212-7776-a13f-2f0624d19e00
                    name: General consultation
                    tally: { sent: 40, answered: 14, response_rate: 0.35, average_score: 4.21 }
                by_staff:
                  - id: 01a0a6d4-4200-7000-8000-00000000c0de
                    name: nurse@clinicq.example
                    tally: { sent: 40, answered: 14, response_rate: 0.35, average_score: 4.21 }
                staff_note: "Scores follow the visits each person marked done. They are for noticing what patients value, not for ranking colleagues, and a small number of answers says very little."
                answers_by_channel: { sms: 9, web: 5 }
                comments:
                  - { answered_at: "2026-09-15T11:02:00+02:00", queue_name: General consultation, score: 4, comment: "Kind nurse. Call me on [REDACTED:phone]" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A date that is not a date, a backwards range, or one longer than a year.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              example: { detail: "The start comes after the end." }

components:
  responses:
    Unauthenticated:
      description: No session, or an expired or deactivated one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Not authenticated" }
    Forbidden:
      description: Signed in, without sites.reports:read at this clinic.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Forbidden" }
    NotFound:
      description: Another clinic's id, or one that does not exist. Indistinguishable on purpose.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Not found." }
    Unprocessable:
      description: A field failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
      example: { detail: "Not found.", code: http.not_found }
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                required: [loc, msg, type]
                properties:
                  loc: { type: array, items: { anyOf: [{ type: string }, { type: integer }] } }
                  msg: { type: string }
                  type: { type: string }
      example:
        detail:
          - { loc: [body, score], msg: "Input should be less than or equal to 5", type: less_than_equal }
    ScoreChoiceOut:
      type: object
      required: [score, label]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        label: { type: string }
      example: { score: 5, label: Very good }
    FeedbackRequestOut:
      type: object
      required: [clinic, question, choices, answered, score, expired, answer_url, max_comment_length]
      properties:
        clinic: { type: string }
        question: { type: string }
        choices: { type: array, items: { $ref: "#/components/schemas/ScoreChoiceOut" } }
        answered: { type: boolean }
        score: { type: [integer, "null"], minimum: 1, maximum: 5 }
        expired: { type: boolean }
        answer_url: { type: [string, "null"] }
        max_comment_length: { type: integer }
      example:
        clinic: Hillbrow Community Health Centre
        question: How was your visit today?
        choices: [{ score: 5, label: Very good }]
        answered: false
        score: null
        expired: true
        answer_url: null
        max_comment_length: 500
    FeedbackAnswerIn:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 500, description: Screened for personal information before it is stored. }
      example: { score: 5, comment: null }
    TallyOut:
      type: object
      required: [sent, answered, response_rate, average_score]
      properties:
        sent: { type: integer, minimum: 0 }
        answered: { type: integer, minimum: 0 }
        response_rate: { type: [number, "null"] }
        average_score: { type: [number, "null"] }
      example: { sent: 10, answered: 4, response_rate: 0.4, average_score: 4.5 }
    SliceOut:
      type: object
      required: [id, name, tally]
      properties:
        id: { type: [string, "null"] }
        name: { type: string }
        tally: { $ref: "#/components/schemas/TallyOut" }
      example: { id: null, name: Not recorded, tally: { sent: 2, answered: 0, response_rate: 0.0, average_score: null } }
    CommentOut:
      type: object
      required: [answered_at, queue_name, score, comment]
      properties:
        answered_at: { type: string, format: date-time }
        queue_name: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
      example: { answered_at: "2026-09-14T15:40:00+02:00", queue_name: Triage, score: 2, comment: "Waited long, but the sister was kind." }
    FeedbackReportOut:
      type: object
      required: [site_id, start, end, overall, distribution, suppressed, by_queue, by_staff, staff_note, answers_by_channel, comments]
      properties:
        site_id: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        overall: { $ref: "#/components/schemas/TallyOut" }
        distribution: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        suppressed: { type: integer, minimum: 0 }
        by_queue: { type: array, items: { $ref: "#/components/schemas/SliceOut" } }
        by_staff: { type: array, items: { $ref: "#/components/schemas/SliceOut" } }
        staff_note: { type: string }
        answers_by_channel: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        comments: { type: array, items: { $ref: "#/components/schemas/CommentOut" } }
