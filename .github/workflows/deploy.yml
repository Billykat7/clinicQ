# Deploy (Issues 11, 230): put a released image on staging or production, safely.
#
#   Run workflow, environment=staging  →  deploys staging
#   Run workflow, environment=production  →  waits for the DevOps/QA Lead's approval (the GitHub
#                                             Environment "production"), then deploys
#   Run workflow with an older version and "rollback"  →  that tag, without its migrations
#
# **The runner is the host.** ClinicQ runs on the BTK platform server, which hosts its own GitHub
# Actions runner (labels `self-hosted, Linux, X64, clinicq, infra`), so this workflow runs *on the
# machine it is deploying to*. There is nothing to SSH into and no key to hold: the steps below are
# the same commands a person would type in the deploy directory. That is the shape the other BTK
# products use (`Billykat7/infra`'s `cd-product.yml`); ClinicQ keeps its own sequence rather than
# calling that one, because its sequence runs the migrations before any traffic and smoke-tests a
# candidate on a side port first, and because `write-prod-env.sh` there knows a shared key list that
# does not include ClinicQ's own settings.
#
# **Every deploy is a manual run**, the same shape as BK Properties' CD: release.yml publishes the
# image on a tag, and a person decides when that image reaches an environment. Nothing here starts
# by itself, so a release is never also a deploy, and "what is running where" only changes when
# somebody chose it. Deploying a fresh release is therefore two steps, not one: push the tag, wait
# for Release to publish the image, then run this with that version.
#
# The work happens in scripts/cd/deploy.sh, one visible step at a time: pre-flight (the image's own
# settings check), the migrations as their own step before any traffic, a candidate on a side port
# nothing routes to, the swap with a live smoke check that rolls back by itself, and a message to
# the team channel. A failure at any step leaves the previous version serving.
# docs/CICD/RUNBOOK_DEPLOY.md is the runbook, including the timed rollback.
#
# **What has to be configured** (docs/CICD/ENVIRONMENTS.md):
#
#   * `DEPLOY_DIR` (an Environment *variable*): the absolute directory on this runner that holds
#     this environment. It is the only required setting, and the only place the host's layout is
#     written down -- deliberately not in this repository, which is public. The app's settings are
#     the `.env` already in that directory, maintained on the host.
#     (`btk-platform-layout.sh` in `Billykat7/infra` is what creates the directory.)
#   * `APP_ENV` (an Environment *secret*, the whole .env) replaces the host's `.env` on every
#     deploy, for a team that would rather keep the settings in GitHub. Optional: without it the
#     file on the host is used and never touched.
#   * `TEAM_WEBHOOK_URL` (optional) posts the result to the team channel.
#
# Until `DEPLOY_DIR` is set and the directory exists, the deploy says exactly what to do, changes
# nothing and succeeds.

name: Deploy

# What the Actions list shows for this run, so a deploy is told apart from a release at a glance,
# and one deploy from another: "Deploy ClinicQ 0.2.0". The environment is on the job below it.
run-name: Deploy ClinicQ ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      version:
        description: "The released version to deploy, e.g. 0.2.0 (an older one rolls back)"
        type: string
        required: true
      rollback:
        description: "Rolling back: skip the migrations (they only ever move forward)"
        type: boolean
        default: false

# One deploy per environment at a time, never cancelled half-way: a half-applied deploy is worse than
# a slow one. The group names the environment, not the ref, so two tags queue for the same host.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    # The platform server's own runner. `clinicq` is the label that pins it to the machine ClinicQ
    # lives on; `DEPLOY_RUNNER_LABELS` (a repository variable, a JSON array) moves the deploy to a
    # different runner without editing this file.
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["self-hosted","Linux","X64","clinicq"]') }}
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ROLLBACK: ${{ inputs.rollback }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Where this environment lives on the runner. A *secret* is the right kind on a public
      # repository -- Actions logs are world-readable, and GitHub masks secrets but not variables.
      # A variable still works (the next step masks the value itself either way); the legacy
      # PRODUCTION_DEPLOY_PATH is accepted verbatim so nothing has to be renamed to deploy.
      DEPLOY_DIR: >-
        ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR
         || secrets.PRODUCTION_DEPLOY_PATH || vars.PRODUCTION_DEPLOY_PATH }}
    steps:
      - name: Check out the deploy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Which image
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"   # v0.2.0 and 0.2.0 both name the same release
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=Not a version::'$version' is not a released version (e.g. 0.2.0)"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clinicq:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### $ENVIRONMENT ← \`$image\`" >> "$GITHUB_STEP_SUMMARY"

      # Whether this environment is provisioned, and nothing else: the directory itself stays in
      # $DEPLOY_DIR, never in a step output and never in a log line. Each Environment names its own
      # directory, so this repository -- which is public -- holds no path on anybody's server, and
      # a host laid out differently needs no change here.
      - name: Where this environment lives
        id: target
        run: |
          # Mask it whatever it came from, so a DEPLOY_DIR kept as a variable is not published by
          # an error message, a `set -x`, or a stack trace later in the job.
          [[ -n "$DEPLOY_DIR" ]] && echo "::add-mask::${DEPLOY_DIR%/}"
          dir="${DEPLOY_DIR%/}"
          if [[ -z "$dir" ]]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=$ENVIRONMENT has no DEPLOY_DIR::nothing was deployed (docs/CICD/RUNBOOK_DEPLOY.md)"
            {
              echo "**Not provisioned:** the \`$ENVIRONMENT\` Environment has no \`DEPLOY_DIR\`, so nothing was deployed."
              echo
              echo "Set the \`DEPLOY_DIR\` **variable** on **Settings → Environments → $ENVIRONMENT**"
              echo "to this runner's absolute deploy directory for $ENVIRONMENT."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$dir" != /* ]]; then
            echo "::error title=DEPLOY_DIR must be absolute::got a relative path"
            exit 1
          fi
          if [[ ! -d "$dir" ]]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=$ENVIRONMENT not provisioned::the DEPLOY_DIR directory does not exist on this runner; nothing was deployed (docs/CICD/RUNBOOK_DEPLOY.md)"
            {
              echo "**Not provisioned:** the \`$ENVIRONMENT\` \`DEPLOY_DIR\` does not exist on this runner, so nothing was deployed."
              echo
              echo "Create it once (\`mkdir -p\` it and put the app's \`.env\` in it), or point"
              echo "\`DEPLOY_DIR\` at where this environment does live."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "provisioned=true" >> "$GITHUB_OUTPUT"
          echo "Deploy directory: set by \`DEPLOY_DIR\` on the \`$ENVIRONMENT\` Environment." >> "$GITHUB_STEP_SUMMARY"

      # Pulling the image is the deploy script's job (pre-flight), but the runner has to be able to
      # read the package first. GITHUB_TOKEN can, for this repository's own package.
      - name: Log in to GHCR
        if: steps.target.outputs.provisioned == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Copy the compose file and the deploy scripts into place
        if: steps.target.outputs.provisioned == 'true'
        run: |
          install -m 644 infra/docker/docker-compose.prod.yml "$DEPLOY_DIR/"
          install -m 755 scripts/cd/deploy.sh scripts/cd/prune-old-app-images.sh "$DEPLOY_DIR/"

      # The app's settings. APP_ENV (the whole .env, an Environment secret) replaces the file when
      # it is set; otherwise the .env already on the host is the source of truth and is left alone.
      # Either way it is never echoed and never leaves this directory.
      - name: The app's settings
        if: steps.target.outputs.provisioned == 'true'
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [[ -n "$APP_ENV" ]]; then
            printf '%s\n' "$APP_ENV" | (umask 077 && cat > "$DEPLOY_DIR/.env")
            echo "Settings: written from the APP_ENV secret ($(grep -c '^[A-Za-z_]' "$DEPLOY_DIR/.env") keys)."
          elif [[ -s "$DEPLOY_DIR/.env" ]]; then
            echo "Settings: the host's own $DEPLOY_DIR/.env ($(grep -c '^[A-Za-z_]' "$DEPLOY_DIR/.env") keys), left as it is."
          else
            echo "::error title=No settings::$DEPLOY_DIR/.env is missing or empty and no APP_ENV secret is set. Put the app's .env on the host, or add APP_ENV to the $ENVIRONMENT Environment."
            exit 1
          fi
          chmod 600 "$DEPLOY_DIR/.env"

      - name: Pre-flight (pull the image, check the settings with its own rules)
        if: steps.target.outputs.provisioned == 'true'
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: cd "$DEPLOY_DIR" && ./deploy.sh preflight "$IMAGE" "$ENVIRONMENT"

      # Before the new image serves anything: the one deploy sequence CI also runs on every pull
      # request (Issue 9), inside the new image. Migrations must stay backward compatible with the
      # previous release, which keeps serving through this step and after a failed deploy.
      - name: Migrations (scripts/db/deploy-sequence.sh in the new image)
        if: steps.target.outputs.provisioned == 'true' && env.ROLLBACK != 'true'
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: cd "$DEPLOY_DIR" && ./deploy.sh run-new "$IMAGE" ./scripts/db/deploy-sequence.sh

      - name: Smoke-test the new image on a side port (no traffic)
        if: steps.target.outputs.provisioned == 'true'
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: cd "$DEPLOY_DIR" && ./deploy.sh candidate "$IMAGE"

      - name: Swap it in and smoke-test it live (rolls back by itself on failure)
        if: steps.target.outputs.provisioned == 'true'
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: cd "$DEPLOY_DIR" && ./deploy.sh swap "$IMAGE" && ./deploy.sh status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tell the team channel
        if: ${{ always() && steps.release.outputs.version != '' }}
        env:
          TEAM_WEBHOOK_URL: ${{ secrets.TEAM_WEBHOOK_URL }}
          TEAM_WEBHOOK_KIND: ${{ vars.TEAM_WEBHOOK_KIND }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ github.sha }}
          RESULT: ${{ steps.target.outputs.provisioned == 'false' && 'skipped' || job.status }}
        run: >-
          python3 scripts/cd/notify_deploy.py --environment "$ENVIRONMENT" --version "$VERSION"
          --sha "$SHA" --result "$RESULT" --run-url "$RUN_URL"
