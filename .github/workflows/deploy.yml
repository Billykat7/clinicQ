# CD ClinicQ (Issues 11, 230, 239, 243): put a released image on production, safely.
#
#   Run workflow, version=0.11.0  →  migrations, then the platform's shared deploy
#   Run workflow with an older version  →  that version, which is how a rollback is done
#
# **Two jobs, and the split is the point.** `migrations` is ClinicQ's, and runs first; `deploy`
# hands the rest to the gateway's `cd-product.yml`, the workflow every BTK product deploys through,
# so the pull, the compose up, the nginx render and the registry row are defined once for all of
# them instead of eleven times.
#
# What stays here is what the shared workflow does not do and ClinicQ will not give up: the
# migrations run **inside the new image, before anything serves it**, and they run the same
# `scripts/db/deploy-sequence.sh` that CI runs on every pull request (Issue 9), so "what a deploy
# does to a database" has one definition. If they fail, the previous version is still serving and
# the deploy job never starts.
#
# **Production only, deliberately (Issue 243).** `cd-product.yml` takes no environment: it pins
# `environment: production` and derives its path from the gateway's own root. A `staging` choice
# here would therefore have read the *production* Environment's secrets and deployed to the
# *production* directory while the run said "staging" — so the choice is gone rather than
# misleading. Staging returns when the shared workflow can express it.
#
# **The image must already exist.** release.yml publishes `:<version>`, `:v<version>`, `:<sha>` and
# `:latest` on a tag; this only deploys. `cd-product.yml` resolves `ghcr.io/<repo>:<image_tag>` and
# insists on a `v`-prefixed semver tag, which is why `v` is added below and why release.yml pushes
# that tag at all. A release is still never also a deploy: somebody chooses this run.
#
# ⚠️ **NOT MERGEABLE YET — one conflict is not ours to resolve.** `cd-product.yml` writes its own
# `$DEPLOY_PATH/.env` from the gateway's `write-prod-env.sh`, whose key list is shared across every
# BTK product and contains none of ClinicQ's ~179 settings. It runs *after* the job below has
# composed the real one, so it would overwrite it, and the app would come up on defaults for every
# `SMS_*`, `QUEUE_*`, `DISPLAY_*`, `PATIENT_*` and `VAPID_*` value. Issue 239 built the two-half
# split precisely to avoid that. `Billykat7/infra` has to leave an existing `.env` alone, or take a
# product env hook, before this workflow may deploy anything.
#
# **What has to be configured** (docs/CICD/ENVIRONMENTS.md): `DEPLOY_DIR` as a *secret* on the
# `production` Environment (Issue 239 — this repository is public, and `vars.*` are not masked in
# Actions logs), plus the secrets `cd-product.yml` inherits. Without `DEPLOY_DIR` the run says so,
# changes nothing and succeeds.

name: CD ClinicQ

# What the Actions list shows for this run, so a deploy is told apart from a release at a glance,
# and one deploy from another: "Deploy ClinicQ 0.2.0".
run-name: Deploy ClinicQ ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The released version to deploy, e.g. 0.11.0 (an older one rolls back)"
        type: string
        required: true

# One deploy at a time, never cancelled half-way: a half-applied deploy is worse than a slow one.
# The group names the product, not the ref, so two versions queue for the same host.
concurrency:
  group: deploy-clinicq
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  # ── ClinicQ's own gate ───────────────────────────────────────────────────────────────────────
  # The migrations, in the new image, before the shared deploy replaces anything.
  migrations:
    name: Migrations before anything serves
    # The platform server's own runner, which is also the deploy host: there is nothing to SSH
    # into. `DEPLOY_RUNNER_LABELS` (a repository variable, a JSON array) moves this to another
    # runner without editing the file.
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["self-hosted","Linux","X64","clinicq"]') }}
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      # The one source of the deploy directory (Issue 239). A secret, not a variable, because this
      # repository is public and Actions masks secrets in the log.
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    outputs:
      provisioned: ${{ steps.target.outputs.provisioned }}
      # Normalised once, here, so the shared deploy below cannot be handed "vv0.11.0".
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the deploy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Which image
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"   # v0.11.0 and 0.11.0 both name the same release
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=Not a version::'$version' is not a released version (e.g. 0.11.0)"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clinicq:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### production ← \`$image\`" >> "$GITHUB_STEP_SUMMARY"

      # The directory is never printed, never a step output and never in a `working-directory:`
      # expression — steps `cd "$DEPLOY_DIR"`. Each Environment names its own.
      - name: Where this environment lives
        id: target
        run: |
          # Mask it whatever it came from, so a DEPLOY_DIR kept as a variable is not published by
          # a step that echoes its own command line.
          [[ -n "$DEPLOY_DIR" ]] && echo "::add-mask::${DEPLOY_DIR%/}"
          dir="${DEPLOY_DIR%/}"
          if [[ -z "$dir" ]]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=production has no DEPLOY_DIR::nothing was deployed (docs/CICD/RUNBOOK_DEPLOY.md)"
            echo "**Not provisioned:** set \`DEPLOY_DIR\` as a secret on the \`production\` Environment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$dir" != /* ]]; then
            echo "::error title=DEPLOY_DIR must be absolute::it is not"
            exit 1
          fi
          if [[ ! -d "$dir" ]]; then
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=production not provisioned::the deploy directory does not exist on this runner"
            echo "**Not provisioned:** the deploy directory does not exist on this runner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "provisioned=true" >> "$GITHUB_OUTPUT"

      # The migrations pull the image themselves; the runner has to be able to read the package.
      - name: Log in to GHCR
        if: steps.target.outputs.provisioned == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Copy the deploy scripts into place
        if: steps.target.outputs.provisioned == 'true'
        run: install -m 755 scripts/cd/deploy.sh scripts/cd/prune-old-app-images.sh "$DEPLOY_DIR/"

      # The app's settings, composed from their two halves: deploy/env/production.env, which is in
      # this repository and reviewed like code, plus the SOPS-encrypted secrets from the private
      # Billykat7/infra checkout on this host (Issue 239). compose-env.sh writes the result to
      # $DEPLOY_DIR/.env (mode 600) and prints counts, never a value.
      #
      # The migrations below need the real settings, so this runs before them. **It is also the
      # unresolved half of Issue 243** — see the header: `cd-product.yml` writes its own `.env`
      # over this one from a key list shared across products.
      - name: The app's settings
        if: steps.target.outputs.provisioned == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SECRETS_DIR: ${{ vars.SECRETS_DIR }}
        run: |
          if ./scripts/cd/compose-env.sh production "$DEPLOY_DIR/.env"; then
            :
          elif [[ -s "$DEPLOY_DIR/.env" ]]; then
            echo "::warning title=Secrets not composed::fell back to the .env already on this host ($(grep -c '^[A-Za-z_]' "$DEPLOY_DIR/.env") keys). See the step log and docs/CICD/RUNBOOK_DEPLOY.md."
          else
            echo "::error title=No settings::the secrets could not be composed and there is no .env on this host. See docs/CICD/RUNBOOK_DEPLOY.md, 'Secrets'."
            exit 1
          fi
          chmod 600 "$DEPLOY_DIR/.env"

      # The one deploy sequence CI also runs on every pull request (Issue 9), inside the new image,
      # before the shared deploy below replaces the serving container. Migrations must stay
      # backward compatible with the previous release, which keeps serving through this step and
      # after a failed one.
      - name: Migrations (scripts/db/deploy-sequence.sh in the new image)
        if: steps.target.outputs.provisioned == 'true'
        env:
          DEPLOY_ENV: production
          IMAGE: ${{ steps.release.outputs.image }}
        run: cd "$DEPLOY_DIR" && ./deploy.sh run-new "$IMAGE" ./scripts/db/deploy-sequence.sh

  # ── The platform's shared deploy ─────────────────────────────────────────────────────────────
  # Pull, compose up, nginx render, registry row and deploy events, defined once in the gateway
  # for every BTK product. Pinned to a commit: a branch can be repointed at other code after review.
  deploy:
    needs: migrations
    if: needs.migrations.outputs.provisioned == 'true'
    uses: Billykat7/infra/.github/workflows/cd-product.yml@b9c3e64fae66fba7d8f35e8690d30e8ca857bf87
    with:
      project_slug: clinicq
      app_port: "8011"
      domain: clinicq.bkatalayi.com
      db_schema: clinicq
      display_name: BK ClinicQ
      compose_file: infra/docker/docker-compose.prod.yml
      # cd-product.yml insists on a v-prefixed semver tag and resolves ghcr.io/<repo>:<tag>;
      # release.yml publishes that tag beside the bare one. The version is the one the job above
      # normalised, so typing "v0.11.0" cannot become "vv0.11.0".
      image_tag: v${{ needs.migrations.outputs.version }}
    secrets: inherit
