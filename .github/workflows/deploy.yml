
name: CD ClinicQ

# What the Actions list shows for this run, so a 'deploy' is told apart from a release at a glance,
# and one deploy from another: "Deploy ClinicQ 0.2.0". The environment is on the job below it.
run-name: Deploy ClinicQ ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      version:
        description: "The released version to deploy, e.g. 0.2.0 (an older one rolls back)"
        type: string
        required: true
      rollback:
        description: "Rolling back: skip the migrations (they only ever move forward)"
        type: boolean
        default: false

# One deploy per environment at a time, never cancelled half-way: a half-applied deploy is worse than
# a slow one. The group names the environment, not the ref, so two tags queue for the same host.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    uses: Billykat7/infra/.github/workflows/cd-product.yml@main
    with:
      project_slug: clinicq
      app_port: "8011"
      domain: clinicq.bkatalayi.com
      db_schema: clinicq
      display_name: BK ClinicQ
      compose_file: infra/docker/docker-compose.prod.yml
      image_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.image_tag }}
    secrets: inherit
