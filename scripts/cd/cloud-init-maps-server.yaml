#cloud-config
# Hetzner cloud-init for Maps server (max 32 KiB). Replaces manual run of server-initial-setup.sh.
# Ref: https://community.hetzner.com/tutorials/basic-cloud-config
#
# Before use: replace DEPLOYER_SSH_PUBLIC_KEY with your key (one line). Optionally set
# GITHUB_RUNNER_TOKEN (from repo Settings → Actions → Runners → Add new self-hosted runner)
# to install the Actions runner on first boot. Then paste this into Hetzner "Cloud config" when creating the server.

users:
  - name: deployer
    groups: [users, admin, sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - DEPLOYER_SSH_PUBLIC_KEY

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - fail2ban
  - ufw

package_update: true
package_upgrade: true

write_files:
  # SSH hardening (drop-in; overrides main sshd_config)
  - path: /etc/ssh/sshd_config.d/99-maps-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 2
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers deployer

  # Optional: paste GitHub Actions runner token here to install runner on first boot. Leave as REPLACE_OR_LEAVE_EMPTY to skip.
  - path: /root/.runner-token
    content: "REPLACE_OR_LEAVE_EMPTY"
    permissions: "0600"

  # Runner install script (runs only if token file is non-empty)
  - path: /root/cloud-init-runner.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -e
      if [[ -s /root/.runner-token ]]; then
        TOKEN=$(cat /root/.runner-token)
        RUNNER_DIR=/home/deployer/actions-runner
        RUNNER_VERSION=2.332.0
        mkdir -p "$RUNNER_DIR"
        curl -fsSL -o "$RUNNER_DIR/runner.tar.gz" "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
        tar xzf "$RUNNER_DIR/runner.tar.gz" -C "$RUNNER_DIR"
        rm -f "$RUNNER_DIR/runner.tar.gz"
        chown -R deployer:deployer "$RUNNER_DIR"
        su - deployer -c "cd $RUNNER_DIR && ./config.sh --url https://github.com/BTKTechnologies/maps --token $TOKEN --unattended"
        "$RUNNER_DIR/svc.sh" install deployer
        "$RUNNER_DIR/svc.sh" start
        rm -f /root/.runner-token
      fi

runcmd:
  # Docker (official repo)
  - install -d -m 0755 /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq && apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deployer
  # fail2ban for SSH
  - printf "[sshd]\nenabled = true\nport = ssh\nbanaction = iptables-multiport\nmaxretry = 5\nfindtime = 600\nbantime = 600\n" > /etc/fail2ban/jail.local
  - systemctl enable fail2ban
  # UFW: SSH only; open 80/443 when app is ready
  - ufw allow 22/tcp comment SSH
  - ufw --force enable
  # GitHub Actions runner (if token was set)
  - /root/cloud-init-runner.sh
  # Apply SSH config and reboot
  - systemctl restart sshd || systemctl restart ssh || true
  - reboot
